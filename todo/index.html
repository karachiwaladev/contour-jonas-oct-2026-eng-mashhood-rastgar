<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Todo</h1>

    <form id="add-form" class="add">
      <input id="add-title" type="text" placeholder="What needs doing?" autocomplete="off" required>
      <div class="row">
        <label>Due <input id="add-due" type="datetime-local"></label>
        <label class="grow">Tags <input id="add-tags" type="text" placeholder="work, home" autocomplete="off"></label>
        <button type="submit">Add</button>
      </div>
    </form>

    <div id="status-filter" class="filters" role="group" aria-label="Status filter">
      <button type="button" data-status="all" class="active" aria-pressed="true">All</button>
      <button type="button" data-status="active" aria-pressed="false">Active</button>
      <button type="button" data-status="done" aria-pressed="false">Completed</button>
    </div>
    <div id="tag-filter" class="chips" role="group" aria-label="Tag filter" hidden></div>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Nothing to do.</p>
    <p id="count" class="count"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
